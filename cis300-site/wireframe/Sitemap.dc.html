<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600&display=swap">
  <style>
    body{margin:0;background:#ffffff;color:#33322e;font-family:'Work Sans',system-ui,sans-serif}
    a{color:#a35d09}a:hover{color:#7d4506}
  </style>
</helmet>

<div style="padding:28px 30px">
  <svg viewBox="0 0 860 400" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block">

    <text x="0" y="18" font-family="Work Sans, system-ui, sans-serif" font-size="17" font-weight="600" fill="#33322e">Bench Notes — Site Map</text>
    <text x="0" y="40" font-family="Work Sans, system-ui, sans-serif" font-size="12" fill="#7a766e">Five pages. Home is the landing page; the four content pages sit one level below it.</text>

    <!-- Home -->
    <rect x="330" y="76" width="200" height="64" rx="4" fill="#33322e" stroke="#33322e" stroke-width="1.5"/>
    <text x="430" y="103" text-anchor="middle" font-family="Work Sans, system-ui, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Home</text>
    <text x="430" y="122" text-anchor="middle" font-family="Work Sans, system-ui, sans-serif" font-size="11.5" fill="#c9c6be">index.html</text>

    <!-- connectors -->
    <path d="M430 140 L430 186" stroke="#a9a59d" stroke-width="1.5" fill="none"/>
    <path d="M115 186 L745 186" stroke="#a9a59d" stroke-width="1.5" fill="none"/>
    <path d="M115 186 L115 226" stroke="#a9a59d" stroke-width="1.5" fill="none"/>
    <path d="M325 186 L325 226" stroke="#a9a59d" stroke-width="1.5" fill="none"/>
    <path d="M535 186 L535 226" stroke="#a9a59d" stroke-width="1.5" fill="none"/>
    <path d="M745 186 L745 226" stroke="#a9a59d" stroke-width="1.5" fill="none"/>

    <!-- content pages -->
    <rect x="25" y="226" width="180" height="80" rx="4" fill="#ffffff" stroke="#33322e" stroke-width="1.5"/>
    <text x="115" y="256" text-anchor="middle" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#33322e">How It Decides</text>
    <text x="115" y="276" text-anchor="middle" font-family="Work Sans, system-ui, sans-serif" font-size="11.5" fill="#7a766e">how-it-decides.html</text>
    <text x="115" y="294" text-anchor="middle" font-family="Work Sans, system-ui, sans-serif" font-size="10.5" fill="#a35d09">contains the table</text>

    <rect x="235" y="226" width="180" height="80" rx="4" fill="#ffffff" stroke="#33322e" stroke-width="1.5"/>
    <text x="325" y="256" text-anchor="middle" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#33322e">FAQ</text>
    <text x="325" y="276" text-anchor="middle" font-family="Work Sans, system-ui, sans-serif" font-size="11.5" fill="#7a766e">faq.html</text>

    <rect x="445" y="226" width="180" height="80" rx="4" fill="#ffffff" stroke="#33322e" stroke-width="1.5"/>
    <text x="535" y="256" text-anchor="middle" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#33322e">About</text>
    <text x="535" y="276" text-anchor="middle" font-family="Work Sans, system-ui, sans-serif" font-size="11.5" fill="#7a766e">about.html</text>

    <rect x="655" y="226" width="180" height="80" rx="4" fill="#ffffff" stroke="#33322e" stroke-width="1.5"/>
    <text x="745" y="256" text-anchor="middle" font-family="Work Sans, system-ui, sans-serif" font-size="14" font-weight="600" fill="#33322e">Contact</text>
    <text x="745" y="276" text-anchor="middle" font-family="Work Sans, system-ui, sans-serif" font-size="11.5" fill="#7a766e">contact.html</text>
    <text x="745" y="294" text-anchor="middle" font-family="Work Sans, system-ui, sans-serif" font-size="10.5" fill="#a35d09">contains the form</text>

    <!-- nav note -->
    <path d="M25 340 L835 340" stroke="#e0ddd6" stroke-width="1.5" fill="none"/>
    <text x="25" y="364" font-family="Work Sans, system-ui, sans-serif" font-size="12" fill="#7a766e">The same nav bar appears on all five pages, so every page links directly to every other page.</text>
    <text x="25" y="384" font-family="Work Sans, system-ui, sans-serif" font-size="12" fill="#7a766e">The hierarchy above shows entry order, not the only path between pages.</text>

  </svg>
</div>
</x-dc>
</body>
</html>
