<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200" role="img" aria-label="Diagram: league settings and player data feed a scoring step, which produces a start or sit recommendation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bx{fill:#ffffff;stroke:#33322e;stroke-width:2}
    .lb{font:600 11px Verdana,sans-serif;fill:#33322e}
    .sm{font:9px Verdana,sans-serif;fill:#5c5952}
    .ar{stroke:#a35d09;stroke-width:2;fill:none;marker-end:url(#a)}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a35d09"/>
    </marker>
  </defs>
  <rect class="bx" x="12" y="14" width="120" height="44" rx="3"/>
  <text class="lb" x="24" y="34">League settings</text>
  <text class="sm" x="24" y="48">PPR, roster slots</text>
  <rect class="bx" x="12" y="76" width="120" height="44" rx="3"/>
  <text class="lb" x="24" y="96">Player data</text>
  <text class="sm" x="24" y="110">Projections, news</text>
  <line class="ar" x1="134" y1="36" x2="184" y2="82"/>
  <line class="ar" x1="134" y1="98" x2="184" y2="98"/>
  <rect class="bx" x="188" y="76" width="118" height="44" rx="3"/>
  <text class="lb" x="204" y="96">Scoring step</text>
  <text class="sm" x="204" y="110">Weighs each factor</text>
  <line class="ar" x1="247" y1="122" x2="247" y2="150"/>
  <rect class="bx" x="110" y="152" width="196" height="36" rx="3" fill="#faf9f7"/>
  <text class="lb" x="208" y="175" text-anchor="middle">Start or sit — with why</text>
</svg>
