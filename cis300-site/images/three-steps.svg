<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 170" width="640" height="170" role="img" aria-label="Diagram: step 1 reads your league, step 2 scores each player, step 3 fills your lineup slots">
  <style>
    .bx{fill:#ffffff;stroke:#33322e;stroke-width:2}
    .st{font:bold 10px Verdana,sans-serif;fill:#a35d09;letter-spacing:1px}
    .lb{font:bold 14px Verdana,sans-serif;fill:#33322e}
    .sm{font:11px Verdana,sans-serif;fill:#5c5952}
    .ar{stroke:#a35d09;stroke-width:2;fill:none;marker-end:url(#a)}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a35d09"/>
    </marker>
  </defs>
  <rect class="bx" x="10" y="20" width="176" height="130" rx="3"/>
  <text class="st" x="26" y="48">STEP 1</text>
  <text class="lb" x="26" y="72">Read your league</text>
  <text class="sm" x="26" y="100">Scoring rules</text>
  <text class="sm" x="26" y="117">Roster slots</text>
  <text class="sm" x="26" y="134">Rosters, from Yahoo</text>
  <line class="ar" x1="190" y1="85" x2="228" y2="85"/>
  <rect class="bx" x="232" y="20" width="176" height="130" rx="3"/>
  <text class="st" x="248" y="48">STEP 2</text>
  <text class="lb" x="248" y="72">Score each player</text>
  <text class="sm" x="248" y="100">Weekly projection</text>
  <text class="sm" x="248" y="117">x your league's rules</text>
  <text class="sm" x="248" y="134">x news confidence</text>
  <line class="ar" x1="412" y1="85" x2="450" y2="85"/>
  <rect class="bx" x="454" y="20" width="176" height="130" rx="3" fill="#faf9f7"/>
  <text class="st" x="470" y="48">STEP 3</text>
  <text class="lb" x="470" y="72">Fill your slots</text>
  <text class="sm" x="470" y="100">Best score starts</text>
  <text class="sm" x="470" y="117">Best leftover: flex</text>
  <text class="sm" x="470" y="134">Everyone else sits</text>
</svg>
